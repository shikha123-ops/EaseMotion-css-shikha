<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Pulse Effect Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Glow Pulse Effect</h1>
    <p>A smooth glow and scale animation for CTAs, badges, and icons.</p>

    <div class="demo-container">

        <!-- Button Example -->
        <div>
            <h3>CTA Button</h3>
            <button class="cta-button glow-pulse">
                Get Started
            </button>
        </div>

        <!-- Badge Example -->
        <div>
            <h3>Notification Badge</h3>
            <span class="badge glow-pulse">
                New
            </span>
        </div>

        <!-- Icon Example -->
        <div>
            <h3>Icon</h3>
            <div class="icon glow-pulse">
                ⭐
            </div>
        </div>

    </div>

</body>
</html>
